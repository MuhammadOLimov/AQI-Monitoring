version: '3.9'

services:

  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: airwatch_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: air_pollution_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strongpassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d air_pollution_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airwatch_net

  # ─── Redis Cache ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: airwatch_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - airwatch_net

  # ─── FastAPI Application ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: airwatch_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-strongpassword123}@db:5432/air_pollution_db
      DATABASE_SYNC_URL: postgresql://postgres:${DB_PASSWORD:-strongpassword123}@db:5432/air_pollution_db
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      DEBUG: "false"
      RELOAD: "false"
      WORKERS: "2"
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - airwatch_net

  # ─── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: airwatch_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/static:/var/www/static:ro
    depends_on:
      - api
    networks:
      - airwatch_net

volumes:
  postgres_data:
    name: airwatch_postgres_data
  redis_data:
    name: airwatch_redis_data

networks:
  airwatch_net:
    name: airwatch_network
    driver: bridge
